# Codex CLI — 合并到 ~/.codex/config.toml
# Codex 只支持全局配置，不支持项目级 MCP 配置
# 推荐: pip install -e D:/AndroidMEM/AndroidMiniMem/mcp，然后将 command 改为 "amem-mcp"，并删除 args

[mcp_servers.amem]
command = "python"
args = ["-m", "amem_mcp"]

[mcp_servers.amem.env]
PYTHONPATH = "D:/AndroidMEM/AndroidMiniMem/mcp"
AMEM_IPC_HOST = "127.0.0.1"
AMEM_IPC_PORT = "28100"
