[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minimem-mcp"
dynamic = ["version"]
description = "MiniMem MCP Server — 通过 HTTP 桥接 GUI 的 IPC Server，为 AI 助手暴露 Android 内存调试能力（MiniMem 1.0.0）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "MiniMem" }
]
keywords = ["mcp", "minimem", "android", "memory", "debugging", "cheat-engine"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
]

[project.scripts]
minimem-mcp = "minimem_mcp.app:main"

[project.urls]
Homepage = "https://github.com/"
Repository = "https://github.com/"

[tool.setuptools.dynamic]
version = { attr = "minimem_mcp.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["minimem_mcp*"]
exclude = ["reference*", "configs*"]
